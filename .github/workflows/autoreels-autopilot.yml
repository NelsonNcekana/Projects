name: AutoReels Autopilot

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Number of topics to process (0 = all)"
        required: false
        default: "0"
  schedule:
    - cron: "0 13 * * *"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUTOREELS_DRY_RUN: "false"
      AUTOREELS_OUTPUT_DIR: output
      AUTOREELS_PUBLIC_BASE_URL: ${{ secrets.AUTOREELS_PUBLIC_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTOREELS_OPENAI_MODEL: gpt-4o-mini
      AUTOREELS_OPENAI_TTS_MODEL: gpt-4o-mini-tts
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate and publish
        run: |
          MAX_ITEMS="${{ github.event.inputs.max_items }}"
          if [ -z "$MAX_ITEMS" ]; then MAX_ITEMS="0"; fi
          python -m autoreels.cli run --campaign campaign.json --publish --max-items "$MAX_ITEMS"

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoreels-output
          path: output/
